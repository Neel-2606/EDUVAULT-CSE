<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | CSE ResourceHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar" class="navbar"></header>

  <main class="container">
    <div class="page-header"><h1>👤 My Profile</h1></div>

    <div class="profile-grid">
      <div class="card">
        <h2 class="section-title" style="margin-top:0">Details</h2>
        <div class="details-table" id="profile-details"></div>
      </div>

      <div class="card">
        <h2 class="section-title" style="margin-top:0">Change Password</h2>
        <form id="password-form" novalidate>
          <div class="form-message"></div>
          <div class="form-group">
            <label for="old-password">Current Password</label>
            <input type="password" id="old-password" autocomplete="current-password">
            <small class="field-error"></small>
          </div>
          <div class="form-group">
            <label for="new-password">New Password</label>
            <input type="password" id="new-password" autocomplete="new-password">
            <small class="field-error"></small>
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <input type="password" id="confirm-password" autocomplete="new-password">
            <small class="field-error"></small>
          </div>
          <button type="submit" class="btn btn-block">Change Password</button>
        </form>
      </div>
    </div>
  </main>

  <footer id="footer" class="footer"></footer>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
